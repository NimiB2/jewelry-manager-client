# Render Blueprint: the React client as a static site.
# Routes are hash-based (#/...), so the app itself needs no rewrite rules.
# Values marked sync:false are asked for once in the Render dashboard.
services:
  - type: web
    name: jewelry-client
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    # Google sign-in runs on this site's own domain (VITE_FIREBASE_AUTH_DOMAIN = this site's host); the
    # handler pages live at Firebase, so they are proxied. This keeps sign-in working on phones, whose
    # browsers block storage shared between two domains.
    routes:
      - type: rewrite
        source: /__/auth/*
        destination: https://jewelry-manager-abdaa.firebaseapp.com/__/auth/*
      - type: rewrite
        source: /__/firebase/init.json
        destination: https://jewelry-manager-abdaa.firebaseapp.com/__/firebase/init.json
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_FIREBASE_API_KEY
        sync: false
      - key: VITE_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: VITE_FIREBASE_PROJECT_ID
        sync: false
      - key: VITE_FIREBASE_STORAGE_BUCKET
        sync: false
      - key: VITE_FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: VITE_FIREBASE_APP_ID
        sync: false
